name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release-ref:
        description: "Existing signed release tag"
        required: true
        type: string
        default: v0.1.7

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_dispatch' &&
    inputs.release-ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF:
    "${{ github.event_name == 'workflow_dispatch' &&
    inputs.release-ref || github.ref_name }}"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Check out release trust root
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3d5d4ee7b83b2c6442039b8a72a571c729ffcead
          path: release-trust
          sparse-checkout: .github/release-allowed-signers
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify signed release tag
        shell: bash
        run: |
          test "$(
            git -C "$GITHUB_WORKSPACE/release-trust" rev-parse HEAD
          )" = "3d5d4ee7b83b2c6442039b8a72a571c729ffcead"
          test "${RELEASE_REF#v}" != "$RELEASE_REF"
          test "$(git cat-file -t "$RELEASE_REF")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_REF")" = \
            "$(git rev-parse HEAD)"
          git \
            -c gpg.format=ssh \
            -c "gpg.ssh.allowedSignersFile=$GITHUB_WORKSPACE/release-trust/.github/release-allowed-signers" \
            verify-tag "$RELEASE_REF"
      - name: Verify release controller commit
        shell: bash
        env:
          WORKFLOW_SHA: "${{ github.workflow_sha }}"
        run: |
          # github.workflow_sha is the commit this workflow
          # file was read from. A tag push reads the controller
          # from the pushed tag, so the two agree. A dispatch
          # reads it from whatever ref was selected, which need
          # not be the signed release target checked out above,
          # and every later job would then run steps the tag
          # never carried. Bind them here, in the job the image
          # build waits on, so a mismatch stops before anything
          # is built or published.
          release_sha="$(git rev-list -n 1 "$RELEASE_REF")"
          head_sha="$(git rev-parse HEAD)"
          test -n "$WORKFLOW_SHA"
          test "$WORKFLOW_SHA" = "$release_sha"
          test "$WORKFLOW_SHA" = "$head_sha"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Verify repository
        run: make verify
      - name: Check Python formatting
        run: make pyformat
      - name: Check document codec
        run: make codec

  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: "${{ steps.images.outputs.matrix }}"
      publish_images:
        "${{ steps.release-mode.outputs.publish_images }}"
      repository_visibility:
        "${{ steps.visibility.outputs.value }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          persist-credentials: false
      - name: Load release image matrix
        id: images
        shell: bash
        run: |
          matrix="$(python3 tools/release_matrix.py)"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
      - name: Read repository visibility
        id: visibility
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          visibility="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq .visibility
          )"
          printf 'value=%s\n' "$visibility" >>"$GITHUB_OUTPUT"
      - name: Select release mode
        id: release-mode
        shell: bash
        run: |
          source_version="${RELEASE_REF#v}"
          image_version="$(jq -r .version images/matrix.json)"
          publish_images=false
          if test "$source_version" = "$image_version"; then
            publish_images=true
          fi
          printf 'publish_images=%s\n' "$publish_images" \
            >>"$GITHUB_OUTPUT"

  images:
    if: needs.matrix.outputs.publish_images == 'true'
    needs: [matrix, verify]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.matrix.outputs.images) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          persist-credentials: false
      - name: Select image platforms
        id: platforms
        shell: bash
        env:
          REPOSITORY_VISIBILITY:
            "${{ needs.matrix.outputs.repository_visibility
            }}"
        run: |
          platforms=linux/amd64
          if test "$REPOSITORY_VISIBILITY" = "public"; then
            platforms=linux/amd64,linux/arm64
          fi
          printf 'value=%s\n' "$platforms" >>"$GITHUB_OUTPUT"
      - name: Set version
        id: version
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" \
            >>"$GITHUB_OUTPUT"
      - name: Set up QEMU
        if:
          needs.matrix.outputs.repository_visibility ==
          'public'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to the image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: images/Dockerfile
          target: "${{ matrix.target }}"
          platforms: "${{ steps.platforms.outputs.value }}"
          push: true
          tags:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}:${{ steps.version.outputs.version }}-${{
            steps.version.outputs.sha }}"
          provenance: mode=max
          sbom: true
          cache-from: "type=gha,scope=${{ matrix.target }}"
          cache-to:
            "type=gha,mode=max,scope=${{ matrix.target }}"
      - name: Verify AMD64 image
        shell: bash
        env:
          BUDGET_MIB: "${{ matrix.budget_mib }}"
          DIGEST: "${{ steps.build.outputs.digest }}"
          IMAGE:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}"
          LANGUAGE: "${{ matrix.language }}"
          TARGET: "${{ matrix.target }}"
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker image tag "$IMAGE@$DIGEST" lint-release-test:amd64
          python3 images/verify_tool_version.py \
            --target "$TARGET" \
            --image lint-release-test:amd64
          python3 images/smoke.py \
            --target "$TARGET" \
            --image lint-release-test:amd64
          python3 images/verify_cli.py \
            --target "$TARGET" \
            --language "$LANGUAGE" \
            --backend docker \
            --image lint-release-test:amd64 \
            --architecture "amd64"
          python3 images/verify_images.py \
            --image lint-release-test:amd64 \
            --budget-mib "$BUDGET_MIB" \
            --target "$TARGET" \
            --architecture "amd64"
          python3 images/verify_registry_size.py \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --platform "linux/amd64" \
            --budget-mib "$BUDGET_MIB"
          docker image rm lint-release-test:amd64
      - name: Attest image
        if:
          needs.matrix.outputs.repository_visibility ==
          'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}"
          subject-digest:
            "${{ steps.build.outputs.digest }}"
          push-to-registry: true
      - name: Scan AMD64 image
        env:
          TRIVY_PLATFORM: linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}@${{ steps.build.outputs.digest }}"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Scan ARM64 image
        if:
          needs.matrix.outputs.repository_visibility ==
          'public'
        env:
          TRIVY_PLATFORM: linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}@${{ steps.build.outputs.digest }}"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
      - name: Record digest
        shell: bash
        env:
          DIGEST: "${{ steps.build.outputs.digest }}"
          GIT_SHA: "${{ steps.version.outputs.sha }}"
          LANGUAGE: "${{ matrix.language }}"
          VERSION: "${{ steps.version.outputs.version }}"
        run: |
          mkdir digest
          printf '{"image":"ghcr.io/trycopilotai/lint-%s","staging_tag":"%s-%s","digest":"%s"}\n' \
            "$LANGUAGE" "$VERSION" "$GIT_SHA" "$DIGEST" \
            >"digest/$LANGUAGE.json"
      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "digest-${{ matrix.language }}"
          path: "digest/${{ matrix.language }}.json"
          if-no-files-found: error

  verify-arm64:
    if: >-
      needs.matrix.outputs.publish_images == 'true' &&
      needs.matrix.outputs.repository_visibility == 'public'
    needs: [images, matrix]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.matrix.outputs.images) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          persist-credentials: false
      - name: Download image digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "digest-${{ matrix.language }}"
          path: digests
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to the image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Verify ARM64 image
        shell: bash
        env:
          BUDGET_MIB: "${{ matrix.budget_mib }}"
          LANGUAGE: "${{ matrix.language }}"
          TARGET: "${{ matrix.target }}"
        run: |
          record="digests/$LANGUAGE.json"
          version="${RELEASE_REF#v}"
          revision="$(git rev-parse HEAD)"
          expected_image="ghcr.io/trycopilotai/lint-$LANGUAGE"
          expected_staging_tag="$version-$revision"
          jq -e \
            --arg image "$expected_image" \
            --arg staging_tag "$expected_staging_tag" \
            '.image == $image and
             .staging_tag == $staging_tag and
             (.digest | test("^sha256:[0-9a-f]{64}$"))' \
            "$record" >/dev/null
          image="$(jq -r .image "$record")"
          digest="$(jq -r .digest "$record")"
          docker pull --platform linux/arm64 "$image@$digest"
          docker image tag "$image@$digest" lint-release-test:arm64
          python3 images/verify_tool_version.py \
            --target "$TARGET" \
            --image lint-release-test:arm64
          python3 images/smoke.py \
            --target "$TARGET" \
            --image lint-release-test:arm64
          python3 images/verify_cli.py \
            --target "$TARGET" \
            --language "$LANGUAGE" \
            --backend docker \
            --image lint-release-test:arm64 \
            --architecture "arm64"
          # No ARM64 canonical inventory is checked in, so
          # `images/verify_images.py --architecture arm64`
          # would look one up and fail here. The registry-size
          # check below measures the exact staged ARM64
          # manifest, so the size gate holds without claiming a
          # content inventory this repository does not have.
          python3 images/verify_registry_size.py \
            --image "$image" \
            --digest "$digest" \
            --platform "linux/arm64" \
            --budget-mib "$BUDGET_MIB"
          docker image rm lint-release-test:arm64

  promote:
    if: >-
      always() && needs.matrix.result == 'success' &&
      needs.images.result == 'success' &&
      needs.matrix.outputs.publish_images == 'true' &&
      ((needs.matrix.outputs.repository_visibility ==
      'public' && needs.verify-arm64.result == 'success') ||
      (needs.matrix.outputs.repository_visibility !=
      'public' && needs.verify-arm64.result == 'skipped'))
    needs: [images, matrix, verify-arm64]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          persist-credentials: false
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Verify complete digest set
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          python3 tools/release_manifest.py \
            --version "$version" \
            --digests digests \
            --verify-only
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to the image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Promote verified manifests
        shell: bash
        env:
          RELEASE_REF: "${{ env.RELEASE_REF }}"
        run: |
          version="${RELEASE_REF#v}"
          for record in digests/*.json; do
            image="$(jq -r .image "$record")"
            staging_tag="$(jq -r .staging_tag "$record")"
            digest="$(jq -r .digest "$record")"
            python3 tools/promote_image.py \
              --image "$image" \
              --version "$version" \
              --staging-tag "$staging_tag" \
              --digest "$digest"
          done

  draft:
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.matrix.result == 'success' &&
      ((needs.matrix.outputs.publish_images == 'true' &&
      needs.promote.result == 'success') ||
      (needs.matrix.outputs.publish_images == 'false' &&
      needs.images.result == 'skipped' &&
      needs.promote.result == 'skipped'))
    needs: [images, matrix, promote, verify]
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Download image digests
        if: needs.matrix.outputs.publish_images == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name:
          Create source archive, manifest, and provenance
        shell: bash
        env:
          PUBLISH_IMAGES:
            "${{ needs.matrix.outputs.publish_images }}"
        run: |
          version="${RELEASE_REF#v}"
          mkdir dist
          # The published SHA256SUMS entry is the digest of the
          # compressed archive, so the compressor is part of the
          # artifact. Different compressors and levels each
          # produce a different digest from the same tar, and a
          # recipient cannot guess which one ran. Pin exactly
          # one here so the chain from the signed tag to the
          # published digest is reproducible.
          git archive \
            --format=tar \
            --prefix="lint-$version/" \
            "$RELEASE_REF" >"dist/lint-$version.tar"
          python3 tools/compress_archive.py \
            --input "dist/lint-$version.tar" \
            --output "dist/lint-$version.tar.gz"
          rm "dist/lint-$version.tar"
          if test "$PUBLISH_IMAGES" = "true"; then
            python3 tools/release_manifest.py \
              --version "$version" \
              --archive "dist/lint-$version.tar.gz" \
              --digests digests \
              --output "dist/release-manifest-$version.json"
          else
            # A release tag is expected to match the version in
            # images/matrix.json, so its own images are built and
            # published above. A mismatch means there is no image
            # set to record; stop rather than publish a manifest
            # with nothing behind its image section.
            printf '%s\n' \
              "release $RELEASE_REF does not match the image" \
              "matrix version; raise images/matrix.json or tag" \
              "the matching version" >&2
            exit 1
          fi
          python3 tools/release_provenance.py \
            --version "$version" \
            --revision "$(git rev-parse HEAD)" \
            --archive "dist/lint-$version.tar.gz" \
            --manifest "dist/release-manifest-$version.json" \
            --workflow .github/workflows/release.yml \
            --output "dist/provenance-$version.intoto.json"
          (
            cd dist
            sha256sum ./* >SHA256SUMS
          )
      - name: Attest source archive
        if:
          needs.matrix.outputs.repository_visibility ==
          'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: "dist/lint-*.tar.gz"
      - name: Create draft release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          draft="$(
            gh release view "$RELEASE_REF" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null || true
          )"
          if test "$draft" = "true"; then
            gh release upload "$RELEASE_REF" \
              --clobber \
              dist/*
          elif test "$draft" = ""; then
            gh release create "$RELEASE_REF" \
              --draft \
              --title "lint $version" \
              --notes "Release artifacts for lint $version." \
              dist/*
          else
            printf '%s\n' \
              "release $RELEASE_REF is already public" >&2
            exit 1
          fi
