name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release-ref:
        description: "Existing signed release tag"
        required: true
        type: string
        default: v0.1.4

permissions:
  contents: read

env:
  RELEASE_REF:
    "${{ github.event_name == 'workflow_dispatch' &&
    inputs.release-ref || github.ref_name }}"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated release tag
        shell: bash
        run: |
          test "${RELEASE_REF#v}" != "$RELEASE_REF"
          test "$(git cat-file -t "$RELEASE_REF")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_REF")" = \
            "$(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Verify repository
        run: make verify
      - name: Check Python formatting
        run: >-
          pipx run --spec black==24.10.0 black --check
          --diff lint.py dlint.py service.py
          action_entrypoint.py tests images scripts skills
          tools
      - name: Check document codec
        run: >-
          npx -y prettier@3.7.4 --check --print-width 60
          --prose-wrap always --trailing-comma none
          README.md CONTRIBUTING.md SECURITY.md action.yml
          .github/workflows .claude-plugin .codex-plugin
          docs skills languages.json images/*.json

  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: "${{ steps.images.outputs.matrix }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          persist-credentials: false
      - name: Load release image matrix
        id: images
        shell: bash
        run: |
          matrix="$(python3 tools/release_matrix.py)"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  images:
    needs: [matrix, verify]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.matrix.outputs.images) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          persist-credentials: false
      - name: Read repository visibility
        id: visibility
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          visibility="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq .visibility
          )"
          printf 'value=%s\n' "$visibility" >>"$GITHUB_OUTPUT"
      - name: Set version
        id: version
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" \
            >>"$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to the private registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: images/Dockerfile
          target: "${{ matrix.target }}"
          platforms: linux/amd64,linux/arm64
          push: true
          tags:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}:${{ steps.version.outputs.version }}-${{
            steps.version.outputs.sha }}"
          provenance: mode=max
          sbom: true
          cache-from: "type=gha,scope=${{ matrix.target }}"
          cache-to:
            "type=gha,mode=max,scope=${{ matrix.target }}"
      - name: Verify AMD64 image
        shell: bash
        env:
          BUDGET_MIB: "${{ matrix.budget_mib }}"
          DIGEST: "${{ steps.build.outputs.digest }}"
          IMAGE:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}"
          TARGET: "${{ matrix.target }}"
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker image tag "$IMAGE@$DIGEST" lint-release-test:amd64
          python3 images/smoke.py \
            --target "$TARGET" \
            --image lint-release-test:amd64
          python3 images/verify_images.py \
            --image lint-release-test:amd64 \
            --budget-mib "$BUDGET_MIB"
          docker image rm lint-release-test:amd64 "$IMAGE@$DIGEST"
      - name: Verify ARM64 image
        shell: bash
        env:
          BUDGET_MIB: "${{ matrix.budget_mib }}"
          DIGEST: "${{ steps.build.outputs.digest }}"
          IMAGE:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}"
          TARGET: "${{ matrix.target }}"
        run: |
          docker pull --platform linux/arm64 "$IMAGE@$DIGEST"
          docker image tag "$IMAGE@$DIGEST" lint-release-test:arm64
          python3 images/smoke.py \
            --target "$TARGET" \
            --image lint-release-test:arm64
          python3 images/verify_images.py \
            --image lint-release-test:arm64 \
            --budget-mib "$BUDGET_MIB"
      - name: Attest image
        if: steps.visibility.outputs.value == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}"
          subject-digest:
            "${{ steps.build.outputs.digest }}"
          push-to-registry: true
      - name: Scan AMD64 image
        env:
          TRIVY_PLATFORM: linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}@${{ steps.build.outputs.digest }}"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Scan ARM64 image
        env:
          TRIVY_PLATFORM: linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref:
            "ghcr.io/trycopilotai/lint-${{ matrix.language
            }}@${{ steps.build.outputs.digest }}"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
      - name: Record digest
        shell: bash
        env:
          DIGEST: "${{ steps.build.outputs.digest }}"
          GIT_SHA: "${{ steps.version.outputs.sha }}"
          LANGUAGE: "${{ matrix.language }}"
          VERSION: "${{ steps.version.outputs.version }}"
        run: |
          mkdir digest
          printf '{"image":"ghcr.io/trycopilotai/lint-%s","staging_tag":"%s-%s","digest":"%s"}\n' \
            "$LANGUAGE" "$VERSION" "$GIT_SHA" "$DIGEST" \
            >"digest/$LANGUAGE.json"
      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "digest-${{ matrix.language }}"
          path: "digest/${{ matrix.language }}.json"
          if-no-files-found: error

  promote:
    needs: images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to the private registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Promote verified manifests
        shell: bash
        env:
          RELEASE_REF: "${{ env.RELEASE_REF }}"
        run: |
          version="${RELEASE_REF#v}"
          for record in digests/*.json; do
            image="$(jq -r .image "$record")"
            staging_tag="$(jq -r .staging_tag "$record")"
            digest="$(jq -r .digest "$record")"
            docker buildx imagetools create \
              --tag "$image:$version" \
              "$image:$staging_tag@$digest"
            promoted="$(docker buildx imagetools inspect \
              "$image:$version" --format '{{json .Manifest.Digest}}')"
            test "$promoted" = "\"$digest\""
          done

  draft:
    needs: promote
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.RELEASE_REF }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Read repository visibility
        id: visibility
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          visibility="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq .visibility
          )"
          printf 'value=%s\n' "$visibility" >>"$GITHUB_OUTPUT"
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create source archive and manifest
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          mkdir dist
          git archive \
            --format=tar \
            --prefix="lint-$version/" \
            "$RELEASE_REF" |
            gzip -n >"dist/lint-$version.tar.gz"
          python3 tools/release_manifest.py \
            --version "$version" \
            --archive "dist/lint-$version.tar.gz" \
            --digests digests \
            --output "dist/release-manifest-$version.json"
          (
            cd dist
            sha256sum ./* >SHA256SUMS
          )
      - name: Attest source archive
        if: steps.visibility.outputs.value == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: "dist/lint-*.tar.gz"
      - name: Create draft release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          draft="$(
            gh release view "$RELEASE_REF" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null || true
          )"
          if test "$draft" = "true"; then
            gh release upload "$RELEASE_REF" \
              --clobber \
              dist/*
          elif test "$draft" = ""; then
            gh release create "$RELEASE_REF" \
              --draft \
              --title "lint $version" \
              --notes "Release artifacts for lint $version." \
              dist/*
          else
            printf '%s\n' \
              "release $RELEASE_REF is already public" >&2
            exit 1
          fi
