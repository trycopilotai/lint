name: Regenerate inventories

# Temporary branch-only workflow: rebuilds every image target
# for amd64 and uploads freshly generated canonical
# inventories as artifacts, because the runtime pin move
# staled the whole checked-in set and no machine with Docker
# is reachable locally. Deleted before merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: One entry per target
        id: matrix
        shell: bash
        run: |
          matrix="$(python3 - <<'PY'
          import json
          record = json.load(open("images/matrix.json"))
          include = []
          for entry in record["images"]:
              include.append(
                  {
                      "language": entry["languages"][0],
                      "target": entry["target"],
                  }
              )
          print(json.dumps({"include": include}))
          PY
          )"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  regenerate:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.matrix) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build AMD64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: images/Dockerfile
          target: "${{ matrix.target }}"
          platforms: linux/amd64
          load: true
          push: false
          tags: "lint-${{ matrix.language }}:ci"
          cache-from:
            "type=gha,scope=${{ matrix.target }}-amd64"
          cache-to: "type=gha,mode=max"
      - name: Regenerate inventory
        run: >-
          python3 images/generate_image_inventory.py --image
          "lint-${{ matrix.language }}:ci" --target "${{
          matrix.target }}" --architecture amd64
      - name: Upload inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "inventory-${{ matrix.target }}"
          path:
            "images/inventories/${{ matrix.target
            }}-amd64.json"
          if-no-files-found: error
          retention-days: 1
