name: Images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "images-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  select:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select image targets
        id: matrix
        shell: bash
        env:
          BASE_SHA:
            "${{ github.event.pull_request.base.sha }}"
        run: |
          if [ -n "$BASE_SHA" ]; then
            matrix="$(python3 tools/changed_matrix.py \
              --base "$BASE_SHA")"
          else
            matrix="$(python3 tools/changed_matrix.py)"
          fi
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  build:
    if: >-
      github.event.repository.private == true &&
      needs.select.outputs.matrix != '{"include":[]}'
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.matrix) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build AMD64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: images/Dockerfile
          target: "${{ matrix.target }}"
          platforms: linux/amd64
          load: true
          push: false
          tags: "lint-${{ matrix.language }}:ci"
          cache-from:
            "type=gha,scope=${{ matrix.target }}-amd64"
          cache-to: "type=gha,mode=max"
      - name: Inspect image
        shell: bash
        env:
          IMAGE: "lint-${{ matrix.language }}:ci"
        run: |
          test "$(docker image inspect "$IMAGE" \
            --format '{{.Config.User}}')" = "65532:65532"
      - name: Smoke image
        run: >-
          python3 images/smoke.py --target "${{
          matrix.target }}" --image "lint-${{
          matrix.language }}:ci"

  build-arm64:
    if: >-
      github.event.repository.private == true &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.matrix != '{"include":[]}'
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.matrix) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: images/Dockerfile
          target: "${{ matrix.target }}"
          platforms: linux/arm64
          load: true
          push: false
          tags: "lint-${{ matrix.language }}:ci-arm64"
          cache-from:
            "type=gha,scope=${{ matrix.target }}-arm64"
          cache-to: "type=gha,mode=max"
      - name: Inspect image
        shell: bash
        env:
          IMAGE: "lint-${{ matrix.language }}:ci-arm64"
        run: |
          test "$(docker image inspect "$IMAGE" \
            --format '{{.Config.User}}')" = "65532:65532"
      - name: Smoke image
        run: >-
          python3 images/smoke.py --target "${{
          matrix.target }}" --image "lint-${{
          matrix.language }}:ci-arm64"
