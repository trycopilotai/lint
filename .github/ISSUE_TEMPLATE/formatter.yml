name: Formatter behavior
description:
  Report a formatter result or request language coverage.
title: ""
labels:
  - formatter
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private source files, or
        vulnerability details.
  - type: input
    id: version
    attributes:
      label: lint version
      placeholder: v0.1.2
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Local
        - Docker
        - GitHub Action
        - HTTP API
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language or formatter
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description:
        Include the command and non-sensitive fixture text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
