<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="700"
  viewBox="0 0 1200 700"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Static lint command demo</title>
  <desc id="description">
    The final frame of the lint command demo, with no
    animation. A terminal checks a requirements file without
    writing, applies the formatting, and confirms that the
    result is clean.
  </desc>
  <rect width="1200" height="700" rx="28" fill="#101418" />
  <circle cx="48" cy="48" r="10" fill="#ff6b6b" />
  <circle cx="80" cy="48" r="10" fill="#ffd166" />
  <circle cx="112" cy="48" r="10" fill="#55d6be" />
  <g
    fill="#f7fbff"
    font-family="ui-monospace, SFMono-Regular, monospace"
    font-size="28"
  >
    <text x="48" y="130">
      $ python3 lint.py --cwd demo-work
    </text>
    <text x="72" y="185" fill="#ffd166">
      requirements.txt needs formatting
    </text>
    <text x="72" y="225" fill="#a7bac5">
      read-only · source unchanged
    </text>
    <text x="48" y="330">
      $ python3 lint.py --cwd demo-work --write
    </text>
    <text x="72" y="385" fill="#55d6be">
      requirements.txt changed
    </text>
    <text x="48" y="490">
      $ python3 lint.py --cwd demo-work
    </text>
    <text x="72" y="545" fill="#55d6be">
      clean · 1 selected · 0 would change
    </text>
  </g>
  <text
    x="48"
    y="640"
    fill="#a7bac5"
    font-family="ui-monospace, SFMono-Regular, monospace"
    font-size="22"
  >
    Reconstructed from evidence/demo-transcript.txt
  </text>
</svg>
